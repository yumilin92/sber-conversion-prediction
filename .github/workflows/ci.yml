name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y libgomp1
      - run: pip install -r requirements.txt pytest==7.4.4 httpx==0.27.0 ruff==0.6.9
      - run: ruff check src tests
      - run: python -m pytest -q   # the parity test skips here: it needs the original data

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sber-conversion .
      - run: |
          docker run -d -p 8000:8000 --name api sber-conversion
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
